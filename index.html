<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR World Projection</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #000; color: #fff; font-family: system-ui, sans-serif; overflow: hidden; width: 100vw; height: 100vh; }
        .stage { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; }
        video { width: 100%; height: 100%; object-fit: cover; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; }
        h1 { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); z-index: 10; font-size: 0.85rem; color: #38bdf8; background: rgba(0,0,0,0.7); padding: 5px 10px; border-radius: 10px; text-transform: uppercase; }
        .controls { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 10; display: flex; gap: 10px; }
        button { background: #0284c7; color: #fff; border: none; padding: 10px 18px; border-radius: 6px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <h1>AR Room Projection</h1>

    <div class="stage">
        <video id="webcam" autoplay playsinline muted></video>
        <canvas id="vectorCanvas"></canvas>
    </div>

    <div class="controls">
        <button onclick="startCamera()">Start Camera</button>
    </div>

    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('vectorCanvas');
        const ctx = canvas.getContext('2d');

        let angleX = 0, angleY = 0;
        let targetX = window.innerWidth / 2;
        let targetY = window.innerHeight / 2;

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            targetX = canvas.width / 2;
            targetY = canvas.height / 2;
        }
        window.addEventListener('resize', resize);

        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "environment" },
                    audio: false
                });
                video.srcObject = stream;
                await video.play();
            } catch (err) {
                alert("Camera access failed: " + err.message);
            }
        }

        function generateSphere(radius, rings, segments) {
            const vertices = [], edges = [];
            for (let i = 0; i <= rings; i++) {
                const theta = (i * Math.PI) / rings;
                for (let j = 0; j <= segments; j++) {
                    const phi = (j * 2 * Math.PI) / segments;
                    vertices.push({
                        x: radius * Math.sin(theta) * Math.cos(phi),
                        y: radius * Math.cos(theta),
                        z: radius * Math.sin(theta) * Math.sin(phi)
                    });
                }
            }
            for (let i = 0; i < rings; i++) {
                for (let j = 0; j < segments; j++) {
                    const first = i * (segments + 1) + j;
                    edges.push([first, first + segments + 1]);
                    edges.push([first, first + 1]);
                }
            }
            return { vertices, edges };
        }

        const sphere = generateSphere(80, 10, 10);

        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            angleX += 1.0;
            angleY += 1.5;

            const radX = angleX * Math.PI / 180;
            const radY = angleY * Math.PI / 180;

            const projected = sphere.vertices.map(v => {
                let x1 = v.x * Math.cos(radY) + v.z * Math.sin(radY);
                let z1 = -v.x * Math.sin(radY) + v.z * Math.cos(radY);
                let y2 = v.y * Math.cos(radX) - z1 * Math.sin(radX);
                let z2 = v.y * Math.sin(radX) + z1 * Math.cos(radX);
                const fov = 400 / (400 + z2);
                return {
                    x: (x1 * fov) + targetX,
                    y: (y2 * fov) + targetY
                };
            });

            ctx.strokeStyle = '#00f0ff';
            ctx.lineWidth = 1;
            sphere.edges.forEach(e => {
                const p1 = projected[e[0]];
                const p2 = projected[e[1]];
                if (p1 && p2) {
                    ctx.beginPath();
                    ctx.moveTo(p1.x, p1.y);
                    ctx.lineTo(p2.x, p2.y);
                    ctx.stroke();
                }
            });

            requestAnimationFrame(render);
        }

        resize();
        render();
        startCamera(); // Try launching camera immediately on load
    </script>
</body>
</html>
