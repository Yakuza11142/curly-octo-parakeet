name: mind spark apk

on: [push] # This runs the workflow every time you push code

jobs:
  build_job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # Essential: it lets the runner "see" your files

      - name: Create a dummy build file
        run: |
          mkdir -p output
          echo "Build successful!" > output/build_result.txt

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-assets
          path: output/ # This uploads everything inside the 'output' folder
          if-no-files-found: error
