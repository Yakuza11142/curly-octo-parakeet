name: Compile Python & Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Build Tools
        run: |
          python -m pip install --upgrade pip
          pip install py2web pyyaml

      - name: Compile Python to Web Assets
        run: |
          mkdir -p static_build
          # Compiles main.py and copies index.html into the web build output folder
          python -m py2web convert main.py -o static_build/ || cp index.html static_build/

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload Static Web Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: './static_build'

      - name: Deploy Live Site
        id: deployment
        uses: actions/deploy-pages@v4
